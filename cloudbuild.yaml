# cloudbuild.yaml
steps:
- name: 'gcr.io/cloud-builders/docker'
  # This step builds the Docker image.
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    docker build --no-cache -t europe-north1-docker.pkg.dev/$_PROJECT_ID/$_SERVICE_NAME/$_SERVICE_NAME .

# Push the container image to Artifact Registry (EU; gcr.io/US removed 2026-09-29)
images:
- 'europe-north1-docker.pkg.dev/$_PROJECT_ID/$_SERVICE_NAME/$_SERVICE_NAME'

# Build logs to Cloud Logging only, not a (US) logs bucket.
options:
  logging: CLOUD_LOGGING_ONLY
